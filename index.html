<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Center & File Transfer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #6366f1;
            --accent-primary-hover: #4f46e5;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-danger: #ef4444;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            margin: 0 0 20px 0;
            color: var(--text-main);
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .section {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--card-border);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"], input[type="file"], input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 12px;
            background-color: var(--accent-primary);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--accent-primary-hover);
            transform: translateY(-1px);
        }

        .code-display {
            background-color: var(--input-bg);
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--accent-success);
            margin-top: 12px;
            border: 1px dashed var(--accent-success);
            user-select: all;
        }

        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Control Center</h2>

    <!-- BEREICH 1: DATEI-AUSTAUSCH -->
    <div class="section">
        <div class="section-title">📦 Datei-Austausch (4-Stelliger Code)</div>
        
        <label for="dateiCode">Datei freigeben:</label>
        <input type="file" id="dateiCode">
        <button onclick="uploadFuerCode()">Code generieren & hochladen</button>
        
        <div id="codeArea" style="display: none;">
            <label>Dein Abhol-Code:</label>
            <div class="code-display" id="generatedCode">----</div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 18px 0 10px 0;">

        <label for="downloadCode">Datei abholen:</label>
        <input type="text" id="downloadCode" placeholder="Z. B. FKRQ" maxlength="4" style="text-transform: uppercase; text-align: center; font-size: 16px; letter-spacing: 3px; font-weight: 600;">
        <button onclick="downloadMitCode()">Datei herunterladen</button>
    </div>

    <!-- BEREICH 2: HANDY SENDER -->
    <div class="section">
        <div class="section-title">📱 Handy-Direktversand</div>
        
        <label for="kanal">Kanal-Name:</label>
        <input type="text" id="kanal" value="mein_test_kanal_123">

        <label for="nachricht">Nachricht:</label>
        <input type="text" id="nachricht" placeholder="Text eingeben...">
        <button onclick="sendeText()">Text an Handy senden</button>

        <label for="dateiHandy">Datei fürs Handy:</label>
        <input type="file" id="dateiHandy">
        <button onclick="sendeDateiAnHandy()">Datei an Handy senden</button>
    </div>

    <div id="status"></div>
</div>

<script>
const REQUIRED_PIN = "1919";

function showStatus(text, type = 'info') {
    const statusDiv = document.getElementById('status');
    statusDiv.style.display = 'block';
    
    if (type === 'loading') {
        statusDiv.style.backgroundColor = 'rgba(245, 158, 11, 0.1)';
        statusDiv.style.color = 'var(--accent-warning)';
        statusDiv.innerText = text;
    } else if (type === 'success') {
        statusDiv.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
        statusDiv.style.color = 'var(--accent-success)';
        statusDiv.innerText = text;
    } else if (type === 'error') {
        statusDiv.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
        statusDiv.style.color = 'var(--accent-danger)';
        statusDiv.innerText = text;
    }
}

function verifyPin() {
    const userPin = prompt("Bitte gib den Sicherheits-PIN ein:");
    if (userPin === REQUIRED_PIN) {
        return true;
    } else {
        alert("Falscher PIN! Zugriff verweigert.");
        showStatus("Falscher PIN eingegeben.", "error");
        return false;
    }
}

function generate4DigitCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let result = '';
    for (let i = 0; i < 4; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
}

// 1. Upload für Code-Transfer
async function uploadFuerCode() {
    const dateiInput = document.getElementById('dateiCode');
    const codeArea = document.getElementById('codeArea');
    const generatedCodeDiv = document.getElementById('generatedCode');

    if (dateiInput.files.length === 0) {
        alert('Bitte wähle zuerst eine Datei aus!');
        return;
    }

    const file = dateiInput.files[0];
    const code4 = generate4DigitCode();
    const transferChannel = 'FILE_TRANSFER_4DIGIT_' + code4;

    showStatus(`Lade "${file.name}" hoch...`, 'loading');

    try {
        const response = await fetch(`https://ntfy.sh/${transferChannel}`, {
            method: 'PUT',
            body: file,
            headers: {
                'Filename': file.name,
                'Title': 'Code Download'
            }
        });

        if (response.ok) {
            showStatus('Datei hochgeladen! Gib den Code auf dem Zielgerät ein.', 'success');
            generatedCodeDiv.innerText = code4;
            codeArea.style.display = 'block';
        } else { throw new Error(); }
    } catch (e) {
        showStatus('Fehler beim Hochladen der Datei.', 'error');
    }
}

// 2. Download mit Code
function downloadMitCode() {
    const code4 = document.getElementById('downloadCode').value.trim().toUpperCase();

    if (code4.length !== 4) {
        alert('Bitte gib einen 4-stelligen Code ein!');
        return;
    }

    const transferChannel = 'FILE_TRANSFER_4DIGIT_' + code4;
    showStatus('Download wird gestartet...', 'success');
    window.location.href = `https://ntfy.sh/${transferChannel}/raw`;
}

// 3. Text an Handy (PIN-Geschützt)
async function sendeText() {
    if (!verifyPin()) return;

    const kanal = document.getElementById('kanal').value.trim();
    const text = document.getElementById('nachricht').value || 'Testnachricht vom Dashboard';

    showStatus('Sende Text...', 'loading');

    try {
        const response = await fetch(`https://ntfy.sh/${kanal}`, {
            method: 'POST',
            body: text,
            headers: { 'Title': 'Dashboard Info' }
        });

        if (response.ok) {
            showStatus('Text erfolgreich gesendet!', 'success');
        } else { throw new Error(); }
    } catch (e) {
        showStatus('Fehler beim Senden!', 'error');
    }
}

// 4. Datei an Handy (PIN-Geschützt)
async function sendeDateiAnHandy() {
    if (!verifyPin()) return;

    const kanal = document.getElementById('kanal').value.trim();
    const dateiInput = document.getElementById('dateiHandy');

    if (dateiInput.files.length === 0) {
        alert('Bitte wähle zuerst eine Datei aus!');
        return;
    }

    const file = dateiInput.files[0];
    showStatus(`Lade "${file.name}" hoch...`, 'loading');

    try {
        const response = await fetch(`https://ntfy.sh/${kanal}`, {
            method: 'PUT',
            body: file,
            headers: {
                'Filename': file.name,
                'Title': 'Datei-Übertragung'
            }
        });

        if (response.ok) {
            showStatus('Datei erfolgreich ans Handy gesendet!', 'success');
        } else { throw new Error(); }
    } catch (e) {
        showStatus('Fehler beim Datei-Upload!', 'error');
    }
}
</script>

</body>
</html>
