<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Center & Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090d16;
            --card-bg: rgba(17, 24, 39, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-glow: rgba(99, 102, 241, 0.3);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #6366f1;
            --accent-primary-hover: #4f46e5;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-danger: #ef4444;
            --input-bg: rgba(3, 7, 18, 0.6);
            --section-bg: rgba(255, 255, 255, 0.02);
            --overlay-bg: rgba(11, 15, 25, 0.92);
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.06);
            --card-border-glow: rgba(79, 70, 229, 0.2);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-primary: #4f46e5;
            --accent-primary-hover: #4338ca;
            --accent-success: #059669;
            --accent-warning: #d97706;
            --accent-danger: #dc2626;
            --input-bg: rgba(241, 245, 249, 0.8);
            --section-bg: rgba(0, 0, 0, 0.015);
            --overlay-bg: rgba(255, 255, 255, 0.92);
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, transform 0.2s ease;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .main-container {
            display: flex;
            gap: 24px;
            width: 100%;
            max-width: 960px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 28px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .card:hover {
            border-color: var(--card-border-glow);
        }

        .card-header-wrapper {
            position: relative;
            text-align: center;
            margin-bottom: 24px;
            padding-top: 4px;
        }

        h2 {
            margin: 0;
            color: var(--text-main);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .theme-toggle-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            width: auto;
            margin: 0;
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent-primary);
            background-color: var(--accent-primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .section {
            background: var(--section-bg);
            border: 1px solid var(--card-border);
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"], input[type="file"], input[type="password"], input[type="time"] {
            width: 100%;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        input[type="file"] {
            padding: 9px;
            cursor: pointer;
        }

        input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            background-color: var(--accent-primary);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        button:hover {
            background-color: var(--accent-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
        }

        .code-display {
            background-color: var(--input-bg);
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--accent-success);
            margin-top: 14px;
            border: 1px dashed rgba(16, 185, 129, 0.4);
            user-select: all;
        }

        #status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .timer-display {
            background-color: var(--input-bg);
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 34px;
            font-weight: 700;
            color: var(--accent-success);
            margin-top: 10px;
            border: 1px solid var(--card-border);
            letter-spacing: 2px;
        }

        .timer-status {
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            font-weight: 600;
            color: var(--accent-warning);
        }

        .settings-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            padding: 0;
            margin: 0;
            width: auto;
            box-shadow: none;
        }
        .settings-btn:hover {
            color: var(--text-main);
            transform: scale(1.1);
            background: none;
            box-shadow: none;
        }

        .settings-panel {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--card-border);
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .settings-row {
            display: flex;
            gap: 10px;
        }
        .settings-row > div {
            flex: 1;
        }

        .section-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 10;
            text-align: center;
        }

        .lock-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="main-container">

    <!-- LINKE KARTE: WETTER & TIMER -->
    <div class="card">
        <div class="card-header-wrapper">
            <h2>Übersicht</h2>
            <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn" title="Design umschalten">
                <span id="themeIcon">☀️</span> <span id="themeText">Light</span>
            </button>
        </div>

        <!-- WETTER BEREICH -->
        <div class="section">
            <div class="section-title"><span>🌤️ Wetter (Barßel)</span></div>
            <div id="weatherInfo" style="display: flex; align-items: center; justify-content: space-between; color: var(--text-main);">
                <span style="font-size: 14px; color: var(--text-muted);">Lade Wetterdaten...</span>
            </div>
        </div>

        <div class="section" style="margin-bottom: 0;">
            <div class="section-title">
                <span>⏱️ Aktuelle Phase</span>
                <button class="settings-btn" onclick="toggleSettings()" title="Einstellungen">⚙️</button>
            </div>
            
            <div id="currentPhaseName" class="timer-status">Lade Status...</div>
            <div id="timerCountdown" class="timer-display">00:00:00</div>

            <!-- ERWEITERTES EINSTELLUNGS-PANEL -->
            <div id="settingsPanel" class="settings-panel">
                <div class="section-title" style="margin-bottom: 8px;">Zeiten-Konfiguration (Mo-Do)</div>
                
                <label>Arbeitsbeginn:</label>
                <input type="time" id="cfgStart" value="07:30">

                <div class="settings-row">
                    <div>
                        <label>Frühstück Start:</label>
                        <input type="time" id="cfgFruehStart" value="08:55">
                    </div>
                    <div>
                        <label>Frühstück Ende:</label>
                        <input type="time" id="cfgFruehEnd" value="09:30">
                    </div>
                </div>

                <div class="settings-row">
                    <div>
                        <label>AU 1 Start:</label>
                        <input type="time" id="cfgAu1Start" value="11:00">
                    </div>
                    <div>
                        <label>AU 1 Ende:</label>
                        <input type="time" id="cfgAu1End" value="11:10">
                    </div>
                </div>

                <div class="settings-row">
                    <div>
                        <label>Mittag Start:</label>
                        <input type="time" id="cfgMittagStart" value="11:55">
                    </div>
                    <div>
                        <label>Mittag Ende:</label>
                        <input type="time" id="cfgMittagEnd" value="12:30">
                    </div>
                </div>

                <div class="settings-row">
                    <div>
                        <label>AU 2 Start:</label>
                        <input type="time" id="cfgAu2Start" value="14:40">
                    </div>
                    <div>
                        <label>AU 2 Ende:</label>
                        <input type="time" id="cfgAu2End" value="14:50">
                    </div>
                </div>

                <label>Feierabend / Aufräumen Ende:</label>
                <input type="time" id="cfgEnd" value="16:00">

                <div class="section-title" style="margin: 14px 0 8px 0;">Freitags-Schicht</div>
                <div class="settings-row">
                    <div>
                        <label>Freitag Start:</label>
                        <input type="time" id="cfgFreitagStart" value="07:30">
                    </div>
                    <div>
                        <label>Freitag Ende:</label>
                        <input type="time" id="cfgFreitagEnd" value="12:30">
                    </div>
                </div>

                <button onclick="saveSettings()" style="margin-top: 16px;">Speichern & Anwenden</button>
            </div>
        </div>
    </div>

    <!-- RECHTE KARTE: CONTROL CENTER -->
    <div class="card">
        <div class="card-header-wrapper">
            <h2>Control Center</h2>
        </div>

        <!-- BEREICH 1: DATEI-AUSTAUSCH -->
        <div class="section">
            <div class="section-title">📦 Datei-Austausch (4-Stelliger Code)</div>
            
            <label for="dateiCode">Datei freigeben:</label>
            <input type="file" id="dateiCode">
            <button onclick="uploadFuerCode()">Code generieren & hochladen</button>
            
            <div id="codeArea" style="display: none;">
                <label>Dein Abhol-Code:</label>
                <div class="code-display" id="generatedCode">----</div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 18px 0 10px 0;">

            <label for="downloadCode">Datei abholen:</label>
            <input type="text" id="downloadCode" placeholder="Z. B. FKRQ" maxlength="4" style="text-transform: uppercase; text-align: center; font-size: 16px; letter-spacing: 3px; font-weight: 600;">
            <button onclick="downloadMitCode()">Datei herunterladen</button>
        </div>

        <!-- BEREICH 2: HANDY SENDER (GESCHÜTZT) -->
        <div class="section" id="handySection" style="margin-bottom: 0;">
            <div class="section-title">📱 Handy-Direktversand</div>
            
            <!-- Overlay für PIN -->
            <div id="handyOverlay" class="section-overlay">
                <div class="lock-icon">🔒</div>
                <div style="font-size: 15px; font-weight: 700; margin-bottom: 4px;">Bereich gesperrt</div>
                <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 14px;">Bitte PIN eingeben:</div>
                <input type="password" id="overlayPinInput" placeholder="••••" maxlength="4" style="text-align: center; font-size: 22px; letter-spacing: 8px; max-width: 170px; margin-bottom: 12px;">
                <button onclick="checkOverlayPin()" style="max-width: 170px; margin-top: 0;">Entsperren</button>
            </div>

            <label for="kanal">Kanal-Name:</label>
            <input type="text" id="kanal" value="mein_test_kanal_123">

            <label for="nachricht">Nachricht:</label>
            <input type="text" id="nachricht" placeholder="Text eingeben...">
            <button onclick="sendeText()">Text an Handy senden</button>

            <label for="dateiHandy">Datei fürs Handy:</label>
            <input type="file" id="dateiHandy">
            <button onclick="sendeDateiAnHandy()">Datei an Handy senden</button>
        </div>

        <div id="status"></div>
    </div>

</div>

<script>
// --- WETTER API (OPEN-METEO FÜR BARSEL) ---
async function fetchWeather() {
    try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=53.2519&longitude=7.8354&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Europe%2FBerlin');
        const data = await response.json();
        const temp = data.current.temperature_2m;
        const wind = data.current.wind_speed_10m;
        const code = data.current.weather_code;
        
        let weatherText = "Klar";
        let icon = "☀️";
        if (code > 0 && code < 3) { icon = "⛅"; weatherText = "Teilweise bewölkt"; }
        else if (code >= 3 && code < 50) { icon = "☁️"; weatherText = "Bewölkt / Nebel"; }
        else if (code >= 50 && code < 70) { icon = "🌧️"; weatherText = "Regen"; }
        else if (code >= 70 && code < 80) { icon = "❄️"; weatherText = "Schnee"; }
        else if (code >= 80) { icon = "⛈️"; weatherText = "Gewitter"; }

        document.getElementById('weatherInfo').innerHTML = `
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 30px;">${icon}</span>
                <div>
                    <div style="font-weight: 700; font-size: 16px; color: var(--text-main);">${temp}°C – ${weatherText}</div>
                    <div style="font-size: 12px; color: var(--text-muted);">Wind: ${wind} km/h</div>
                </div>
            </div>
        `;
    } catch (e) {
        document.getElementById('weatherInfo').innerText = "Wetter konnte nicht geladen werden.";
    }
}
fetchWeather();
setInterval(fetchWeather, 30 * 60 * 1000);

// --- THEME TOGGLE LOGIK ---
function setTheme(theme) {
    if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('themeIcon').innerText = '🌙';
        document.getElementById('themeText').innerText = 'Dark';
        localStorage.setItem('dashboard_theme', 'light');
    } else {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('themeIcon').innerText = '☀️';
        document.getElementById('themeText').innerText = 'Light';
        localStorage.setItem('dashboard_theme', 'dark');
    }
}

function toggleTheme() {
    const currentTheme = localStorage.getItem('dashboard_theme');
    if (currentTheme === 'light') {
        setTheme('dark');
    } else {
        setTheme('light');
    }
}

(function() {
    const savedTheme = localStorage.getItem('dashboard_theme');
    if (savedTheme) setTheme(savedTheme);
})();

// --- TIMER & EINSTELLUNGEN LOGIK ---
const REQUIRED_PIN = "1919";

let scheduleConfig = {
    start: "07:30",
    fruehStart: "08:55",
    fruehEnd: "09:30",
    au1Start: "11:00",
    au1End: "11:10",
    mittagStart: "11:55",
    mittagEnd: "12:30",
    au2Start: "14:40",
    au2End: "14:50",
    end: "16:00",
    freitagStart: "07:30",
    freitagEnd: "12:30"
};

function loadSettings() {
    const saved = localStorage.getItem('dashboard_schedule_config');
    if (saved) {
        try {
            scheduleConfig = JSON.parse(saved);
        } catch(e) {}
    }
    document.getElementById('cfgStart').value = scheduleConfig.start;
    document.getElementById('cfgFruehStart').value = scheduleConfig.fruehStart;
    document.getElementById('cfgFruehEnd').value = scheduleConfig.fruehEnd;
    document.getElementById('cfgAu1Start').value = scheduleConfig.au1Start;
    document.getElementById('cfgAu1End').value = scheduleConfig.au1End;
    document.getElementById('cfgMittagStart').value = scheduleConfig.mittagStart;
    document.getElementById('cfgMittagEnd').value = scheduleConfig.mittagEnd;
    document.getElementById('cfgAu2Start').value = scheduleConfig.au2Start;
    document.getElementById('cfgAu2End').value = scheduleConfig.au2End;
    document.getElementById('cfgEnd').value = scheduleConfig.end;
    document.getElementById('cfgFreitagStart').value = scheduleConfig.freitagStart;
    document.getElementById('cfgFreitagEnd').value = scheduleConfig.freitagEnd;
}

function toggleSettings() {
    const panel = document.getElementById('settingsPanel');
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}

function saveSettings() {
    scheduleConfig.start = document.getElementById('cfgStart').value;
    scheduleConfig.fruehStart = document.getElementById('cfgFruehStart').value;
    scheduleConfig.fruehEnd = document.getElementById('cfgFruehEnd').value;
    scheduleConfig.au1Start = document.getElementById('cfgAu1Start').value;
    scheduleConfig.au1End = document.getElementById('cfgAu1End').value;
    scheduleConfig.mittagStart = document.getElementById('cfgMittagStart').value;
    scheduleConfig.mittagEnd = document.getElementById('cfgMittagEnd').value;
    scheduleConfig.au2Start = document.getElementById('cfgAu2Start').value;
    scheduleConfig.au2End = document.getElementById('cfgAu2End').value;
    scheduleConfig.end = document.getElementById('cfgEnd').value;
    scheduleConfig.freitagStart = document.getElementById('cfgFreitagStart').value;
    scheduleConfig.freitagEnd = document.getElementById('cfgFreitagEnd').value;

    localStorage.setItem('dashboard_schedule_config', JSON.stringify(scheduleConfig));
    toggleSettings();
    showStatus('Zeiten erfolgreich gespeichert!', 'success');
}

function timeToMinutes(timeStr) {
    const parts = timeStr.split(':');
    return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}

function updateTimer() {
    const now = new Date();
    const day = now.getDay(); 
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const currentSeconds = now.getSeconds();
    const totalCurrentSec = currentMinutes * 60 + currentSeconds;

    const phaseNameEl = document.getElementById('currentPhaseName');
    const countdownEl = document.getElementById('timerCountdown');

    if (day === 0 || day === 6) {
        phaseNameEl.innerText = "Wochenende 🌴";
        countdownEl.innerText = "00:00:00";
        return;
    }

    const isFreitag = (day === 5);
    let schedule = [];

    if (!isFreitag) {
        schedule = [
            { name: "Arbeit (1. Block)", start: scheduleConfig.start, end: scheduleConfig.fruehStart },
            { name: "Frühstückspause", start: scheduleConfig.fruehStart, end: scheduleConfig.fruehEnd },
            { name: "Arbeit (2. Block)", start: scheduleConfig.fruehEnd, end: scheduleConfig.au1Start },
            { name: "AU (Kleine Pause)", start: scheduleConfig.au1Start, end: scheduleConfig.au1End },
            { name: "Arbeit (3. Block)", start: scheduleConfig.au1End, end: scheduleConfig.mittagStart },
            { name: "Mittagspause", start: scheduleConfig.mittagStart, end: scheduleConfig.mittagEnd },
            { name: "Arbeit (4. Block)", start: scheduleConfig.mittagEnd, end: scheduleConfig.au2Start },
            { name: "AU (Kleine Pause)", start: scheduleConfig.au2Start, end: scheduleConfig.au2End },
            { name: "Arbeit / Aufräumen", start: scheduleConfig.au2End, end: scheduleConfig.end }
        ];
    } else {
        schedule = [
            { name: "Freitags-Schicht", start: scheduleConfig.freitagStart, end: scheduleConfig.freitagEnd }
        ];
    }

    let activePhase = null;
    for (let i = 0; i < schedule.length; i++) {
        let sM = timeToMinutes(schedule[i].start);
        let eM = timeToMinutes(schedule[i].end);
        if (currentMinutes >= sM && currentMinutes < eM) {
            activePhase = schedule[i];
            break;
        }
    }

    let workStartM = timeToMinutes(isFreitag ? scheduleConfig.freitagStart : scheduleConfig.start);

    if (!activePhase) {
        if (currentMinutes < workStartM) {
            phaseNameEl.innerText = "Vor Arbeitsbeginn";
            let diffSec = (workStartM * 60) - totalCurrentSec;
            countdownEl.innerText = formatSeconds(diffSec);
        } else {
            phaseNameEl.innerText = "Feierabend 🎉";
            countdownEl.innerText = "00:00:00";
        }
        return;
    }

    let endSec = timeToMinutes(activePhase.end) * 60;
    let remainingSec = endSec - totalCurrentSec;

    phaseNameEl.innerText = activePhase.name;
    countdownEl.innerText = formatSeconds(remainingSec);
}

function formatSeconds(totalSec) {
    if (totalSec < 0) totalSec = 0;
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

loadSettings();
setInterval(updateTimer, 1000);
updateTimer();

function showStatus(text, type = 'info') {
    const statusDiv = document.getElementById('status');
    statusDiv.style.display = 'block';
    
    if (type === 'loading') {
        statusDiv.style.backgroundColor = 'rgba(245, 158, 11, 0.12)';
        statusDiv.style.color = 'var(--accent-warning)';
        statusDiv.innerText = text;
    } else if (type === 'success') {
        statusDiv.style.backgroundColor = 'rgba(16, 185, 129, 0.12)';
        statusDiv.style.color = 'var(--accent-success)';
        statusDiv.innerText = text;
    } else if (type === 'error') {
        statusDiv.style.backgroundColor = 'rgba(239, 68, 68, 0.12)';
        statusDiv.style.color = 'var(--accent-danger)';
        statusDiv.innerText = text;
    }
}

function checkOverlayPin() {
    const eingabe = document.getElementById('overlayPinInput').value;
    if (eingabe === REQUIRED_PIN) {
        document.getElementById('handyOverlay').style.display = 'none';
        showStatus('Handy-Versand erfolgreich entsperrt.', 'success');
    } else {
        alert('Falscher PIN!');
        document.getElementById('overlayPinInput').value = '';
        document.getElementById('overlayPinInput').focus();
        showStatus('Falscher PIN eingegeben.', 'error');
    }
}

document.getElementById('overlayPinInput').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') {
        checkOverlayPin();
    }
});

function generate4DigitCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let result = '';
    for (let i = 0; i < 4; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
}

async function uploadFuerCode() {
    const dateiInput = document.getElementById('dateiCode');
    const codeArea = document.getElementById('codeArea');
    const generatedCodeDiv = document.getElementById('generatedCode');

    if (dateiInput.files.length === 0) {
        alert('Bitte wähle zuerst eine Datei aus!');
        return;
    }

    const file = dateiInput.files[0];
    const code4 = generate4DigitCode();
    const transferChannel = 'FILE_TRANSFER_4DIGIT_' + code4;

    showStatus(`Lade "${file.name}" hoch...`, 'loading');

    try {
        const response = await fetch(`https://ntfy.sh/${transferChannel}`, {
            method: 'PUT',
            body: file,
            headers: { 'Filename': file.name, 'Title': 'Code Download' }
        });

        if (response.ok) {
            showStatus('Datei hochgeladen! Gib den Code auf dem Zielgerät ein.', 'success');
            generatedCodeDiv.innerText = code4;
            codeArea.style.display = 'block';
        } else { throw new Error(); }
    } catch (e) {
        showStatus('Fehler beim Hochladen der Datei.', 'error');
    }
}

// --- KORRIGIERTE DOWNLOAD-LOGIK FÜR NTFY.SH ---
async function downloadMitCode() {
    const code4 = document.getElementById('downloadCode').value.trim().toUpperCase();
    if (code4.length !== 4) {
        alert('Bitte gib einen 4-stelligen Code ein!');
        return;
    }
    const transferChannel = 'FILE_TRANSFER_4DIGIT_' + code4;
    showStatus('Suche Datei...', 'loading');

    try {
        const response = await fetch(`https://ntfy.sh/${transferChannel}/json?poll=1`);
        if (!response.ok) {
            throw new Error('Kanal nicht gefunden.');
        }
        const text = await response.text();
        const lines = text.trim().split('\n');
        let attachmentUrl = null;

        for (const line of lines) {
            if (!line) continue;
            try {
                const msg = JSON.parse(line);
                if (msg.attachment && msg.attachment.url) {
                    attachmentUrl = msg.attachment.url;
                    break;
                }
            } catch (err) {}
        }

        if (attachmentUrl) {
            showStatus('Datei gefunden! Download wird gestartet...', 'success');
            window.location.href = attachmentUrl;
        } else {
            showStatus('Keine Datei für diesen Code gefunden.', 'error');
        }
    } catch (e) {
        showStatus('Fehler beim Abrufen der Datei.', 'error');
    }
}

async function sendeText() {
    const kanal = document.getElementById('kanal').value.trim();
    const nachricht = document.getElementById('nachricht').value.trim();

    if (!kanal || !nachricht) {
        alert('Bitte Kanal und Nachricht eingeben!');
        return;
    }

    showStatus('Sende Nachricht...', 'loading');
    try {
        const response = await fetch(`https://ntfy.sh/${kanal}`, {
            method: 'POST',
            body: nachricht,
            headers: { 'Title': 'Control Center Nachricht' }
        });

        if (response.ok) {
            showStatus('Nachricht erfolgreich gesendet!', 'success');
            document.getElementById('nachricht').value = '';
        } else { throw new Error(); }
    } catch (e) {
        showStatus('Fehler beim Senden der Nachricht.', 'error');
    }
}

async function sendeDateiAnHandy() {
    const kanal = document.getElementById('kanal').value.trim();
    const dateiInput = document.getElementById('dateiHandy');

    if (!kanal || dateiInput.files.length === 0) {
        alert('Bitte Kanal und Datei auswählen!');
        return;
    }

    const file = dateiInput.files[0];
    showStatus(`Sende "${file.name}" an Handy...`, 'loading');

    try {
        const response = await fetch(`https://ntfy.sh/${kanal}`, {
            method: 'PUT',
            body: file,
            headers: { 'Filename': file.name, 'Title': 'Handy Direktversand' }
        });

        if (response.ok) {
            showStatus('Datei erfolgreich ans Handy gesendet!', 'success');
            dateiInput.value = '';
        } else { throw new Error(); }
    } catch (e) {
        showStatus('Fehler beim Senden der Datei.', 'error');
    }
}
