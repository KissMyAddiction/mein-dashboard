<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handy-Steuerung & Dateitransfer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #313244;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }
        h2, h3 {
            margin-top: 0;
            color: #89b4fa;
            text-align: center;
        }
        h3 {
            font-size: 15px;
            margin-top: 20px;
            border-bottom: 1px solid #45475a;
            padding-bottom: 5px;
        }
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 13px;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #45475a;
            background-color: #1e1e2e;
            color: #cdd6f4;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #a6e3a1;
            color: #11111b;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #94e2d5;
        }
        button.blue-btn {
            background-color: #89b4fa;
        }
        button.blue-btn:hover {
            background-color: #b4befe;
        }
        button.alarm-btn {
            background-color: #f38ba8;
            color: #11111b;
        }
        button.alarm-btn:hover {
            background-color: #eba0ac;
        }
        .code-display {
            background-color: #181825;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #f9e2af;
            margin-top: 10px;
            user-select: all;
            border: 1px dashed #f9e2af;
        }
        #status {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Control Center</h2>

    <!-- BEREICH 1: DATEI-AUSTAUSCH MIT 4-STELLIGEM CODE -->
    <h3>📦 Datei freigeben & mit 4-stelligem Code abholen</h3>
    
    <!-- Hochladen -->
    <label for="dateiCode">Datei zum Freigeben auswählen:</label>
    <input type="file" id="dateiCode">
    <button class="blue-btn" onclick="uploadFuerCode()">Datei hochladen & 4-stelligen Code generieren</button>
    
    <div id="codeArea" style="display: none;">
        <label>Dein 4-stelliger Abhol-Code:</label>
        <div class="code-display" id="generatedCode">----</div>
    </div>

    <!-- Herunterladen -->
    <label for="downloadCode" style="margin-top: 15px;">Datei mit 4-stelligem Code abholen:</label>
    <input type="text" id="downloadCode" placeholder="z. B. A3K9" maxlength="4" style="text-transform: uppercase; text-align: center; font-size: 16px; letter-spacing: 2px;">
    <button class="blue-btn" onclick="downloadMitCode()">Datei herunterladen</button>


    <!-- BEREICH 2: HANDY SENDER (UNVERÄNDERT) -->
    <h3>📱 Direkter Handy-Versand</h3>
    
    <label for="kanal">Kanal-Name:</label>
    <input type="text" id="kanal" value="mein_test_kanal_123">

    <label for="nachricht">Text / Nachricht:</label>
    <input type="text" id="nachricht" placeholder="Sende eine kurze Info...">
    <button onclick="sendeText()">Text an Handy senden</button>

    <label for="dateiHandy">Datei für Handy:</label>
    <input type="file" id="dateiHandy">
    <button onclick="sendeDateiAnHandy()">Datei an Handy senden</button>

    <button class="alarm-btn" onclick="sendeAlarm()">⚠️ Test-Alarm auslösen</button>

    <div id="status"></div>
</div>

<script>
// Hilfsfunktion: Exakt 4-stelligen Code generieren
function generate4DigitCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let result = '';
    for (let i = 0; i < 4; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
}

// 1. Datei hochladen und 4-stelligen Code erstellen
async function uploadFuerCode() {
    const dateiInput = document.getElementById('dateiCode');
    const statusDiv = document.getElementById('status');
    const codeArea = document.getElementById('codeArea');
    const generatedCodeDiv = document.getElementById('generatedCode');

    if (dateiInput.files.length === 0) {
        alert('Bitte wähle zuerst eine Datei aus!');
        return;
    }

    const file = dateiInput.files[0];
    const code4 = generate4DigitCode();
    const transferChannel = 'FILE_TRANSFER_4DIGIT_' + code4;

    statusDiv.style.color = '#f9e2af';
    statusDiv.innerText = `Lade "${file.name}" hoch... Bitte warten.`;

    try {
        const response = await fetch(`https://ntfy.sh/${transferChannel}`, {
            method: 'PUT',
            body: file,
            headers: {
                'Filename': file.name,
                'Title': 'Code Download'
            }
        });

        if (response.ok) {
            statusDiv.style.color = '#a6e3a1';
            statusDiv.innerText = 'Datei erfolgreich hochgeladen!';
            
            // Zeigt exakt die 4 Stellen an
            generatedCodeDiv.innerText = code4;
            codeArea.style.display = 'block';
        } else { throw new Error(); }
    } catch (e) {
        statusDiv.style.color = '#f38ba8';
        statusDiv.innerText = 'Fehler beim Hochladen der Datei!';
    }
}

// 2. Datei mit 4-stelligem Code abholen
function downloadMitCode() {
    const code4 = document.getElementById('downloadCode').value.trim().toUpperCase();
    const statusDiv = document.getElementById('status');

    if (code4.length !== 4) {
        alert('Bitte gib einen gültigen 4-stelligen Code ein!');
        return;
    }

    const transferChannel = 'FILE_TRANSFER_4DIGIT_' + code4;
    const downloadUrl = `https://ntfy.sh/${transferChannel}/raw`;

    statusDiv.style.color = '#a6e3a1';
    statusDiv.innerText = `Lade Datei für Code "${code4}" herunter...`;

    window.open(downloadUrl, '_blank');
}

// 3. Normalen Text an Handy senden
async function sendeText() {
    const kanal = document.getElementById('kanal').value.trim();
    const text = document.getElementById('nachricht').value || 'Testnachricht vom Dashboard';
    const statusDiv = document.getElementById('status');

    statusDiv.style.color = '#f9e2af';
    statusDiv.innerText = 'Sende Text...';

    try {
        const response = await fetch(`https://ntfy.sh/${kanal}`, {
            method: 'POST',
            body: text,
            headers: { 'Title': 'Dashboard Info' }
        });

        if (response.ok) {
            statusDiv.style.color = '#a6e3a1';
            statusDiv.innerText = 'Text erfolgreich gesendet!';
        } else { throw new Error(); }
    } catch (e) {
        statusDiv.style.color = '#f38ba8';
        statusDiv.innerText = 'Fehler beim Senden!';
    }
}

// 4. Datei an Handy senden
async function sendeDateiAnHandy() {
    const kanal = document.getElementById('kanal').value.trim();
    const dateiInput = document.getElementById('dateiHandy');
    const statusDiv = document.getElementById('status');

    if (dateiInput.files.length === 0) {
        alert('Bitte wähle zuerst eine Datei aus!');
        return;
    }

    const file = dateiInput.files[0];
    statusDiv.style.color = '#f9e2af';
    statusDiv.innerText = `Lade "${file.name}" hoch...`;

    try {
        const response = await fetch(`https://ntfy.sh/${kanal}`, {
            method: 'PUT',
            body: file,
            headers: {
                'Filename': file.name,
                'Title': 'Datei-Uebertragung'
            }
        });

        if (response.ok) {
            statusDiv.style.color = '#a6e3a1';
            statusDiv.innerText = 'Datei erfolgreich ans Handy gesendet!';
        } else { throw new Error(); }
    } catch (e) {
        statusDiv.style.color = '#f38ba8';
        statusDiv.innerText = 'Fehler beim Datei-Upload!';
    }
}

// 5. Test-Alarm senden
async function sendeAlarm() {
    const kanal = document.getElementById('kanal').value.trim();
    const statusDiv = document.getElementById('status');

    statusDiv.style.color = '#f9e2af';
    statusDiv.innerText = 'Sende Alarm...';

    try {
        const response = await fetch(`https://ntfy.sh/${kanal}`, {
            method: 'POST',
            body: 'Achtung! Das ist ein hoher Alarm-Test von deinem Dashboard.',
            headers: {
                'Title': '🚨 System Alarm!',
                'Priority': 'high',
                'Tags': 'warning,fire',
                'Actions': 'view, Google öffnen, https://google.com'
            }
        });

        if (response.ok) {
            statusDiv.style.color = '#a6e3a1';
            statusDiv.innerText = 'Alarm erfolgreich ausgelöst!';
        } else { throw new Error(); }
    } catch (e) {
        statusDiv.style.color = '#f38ba8';
        statusDiv.innerText = 'Fehler beim Alarm-Senden!';
    }
}
</script>

</body>
</html>
